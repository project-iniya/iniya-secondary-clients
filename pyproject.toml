[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iniya-secondary-clients"
version = "0.1.2"
description = "Client utilities for Iniya system"
readme = "README.md"
authors = [{ name="night_games_20" }]
license-files = ["LICENSE"]
license = "MIT"
requires-python = "==3.13.*"

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["Iniya.models*", "Iniya.models.*"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
Iniya = ["requirements.txt"]